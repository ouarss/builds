name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      # Supprime les anciens déploiements de l'environnement, ne garde que le dernier
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner, repo, environment: 'github-pages', per_page: 100,
            });
            for (const d of deployments.slice(1)) {
              await github.rest.repos.createDeploymentStatus({ owner, repo, deployment_id: d.id, state: 'inactive' });
              await github.rest.repos.deleteDeployment({ owner, repo, deployment_id: d.id });
            }
