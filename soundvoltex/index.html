t will make the job.", "likes": 2, "replies": 0, "views": 0, "media": [{"file": "media/11-1128009285332549632-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/11-1128009285332549632-2.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1128016217153966080", "url": "https://x.com/Ouarss/status/1128016217153966080", "date": "2019-05-13 19:16:38", "text": "Not that perfect, but the built really look alike. A little bit too much white. And the shiny parts doesn't do justice o/", "likes": 0, "replies": 1, "views": 0, "media": [{"file": "media/12-1128016217153966080-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/12-1128016217153966080-2.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/12-1128016217153966080-3.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/12-1128016217153966080-4.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1128016835314704386", "url": "https://x.com/Ouarss/status/1128016835314704386", "date": "2019-05-13 19:19:05", "text": "Which one is the real? Same size, acrylic parts can be swapped. But the mount of the AC knobs aren't the same :v", "likes": 0, "replies": 0, "views": 0, "media": [{"file": "media/13-1128016835314704386-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/13-1128016835314704386-2.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1128017105121619969", "url": "https://x.com/Ouarss/status/1128017105121619969", "date": "2019-05-13 19:20:10", "text": "3rd pic is supposed to be 180° rotated.", "likes": 0, "replies": 0, "views": 0, "media": []}, {"id": "1128740732095934475", "url": "https://x.com/Ouarss/status/1128740732095934475", "date": "2019-05-15 19:15:36", "text": "Light tests inc.", "likes": 0, "replies": 0, "views": 0, "media": [{"file": "media/15-1128740732095934475-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/15-1128740732095934475-2.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1128796490577657864", "url": "https://x.com/Ouarss/status/1128796490577657864", "date": "2019-05-15 22:57:10", "text": "Ok, ça brille de mille feux.\nNext : custom idle modes.", "likes": 4, "replies": 0, "views": 0, "media": [{"file": "media/16-1128796490577657864-1.mp4", "type": "video", "width": 1280, "height": 720, "duration": 27.618, "poster": "media/16-1128796490577657864-1.poster.jpg"}]}, {"id": "1128797743424651270", "url": "https://x.com/Ouarss/status/1128797743424651270", "date": "2019-05-15 23:02:08", "text": "Mon ignorance dépasse l'entendement.\nDes semaines d'attente de composants pour au final découvrir que les stripes de led adressables (ws2812) n'ont pas besoin de mosfets, ils sont déjà intégrés à chaque led ; Il suffisait juste de brancher le tout en raw.\nRendez-moi mes soirées.", "likes": 0, "replies": 1, "views": 0, "media": []}, {"id": "1130519998915600384", "url": "https://x.com/Ouarss/status/1130519998915600384", "date": "2019-05-20 17:05:46", "text": "Brand new encoder, but the broken one has been fixed with some glue :v we're almost ready for the panel.", "likes": 2, "replies": 0, "views": 0, "media": [{"file": "media/18-1130519998915600384-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1130901348252356610", "url": "https://x.com/Ouarss/status/1130901348252356610", "date": "2019-05-21 18:21:07", "text": "Gamo2 vs real thing, we'll try to swap some parts. It fits the bootleg panel where the original ones can't ! Gonna make another usb pad later with that :v", "likes": 0, "replies": 0, "views": 0, "media": [{"file": "media/19-1130901348252356610-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/19-1130901348252356610-2.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1130908888046493696", "url": "https://x.com/Ouarss/status/1130908888046493696", "date": "2019-05-21 18:51:04", "text": "We can swap almost everything but the red ones. Encoders are the real ones. Torque limiters seems different, 5W5NB vs 5W9AB but feels the same.", "likes": 0, "replies": 0, "views": 0, "media": [{"file": "media/20-1130908888046493696-1.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}, {"file": "media/20-1130908888046493696-2.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}]}, {"id": "1130910580368449537", "url": "https://x.com/Ouarss/status/1130910580368449537", "date": "2019-05-21 18:57:48", "text": "Smart move from gamo2, the plastic part recover the torque limiter pegs. I think the right one got damaged because one peg broke and people still played play with the part stuck below :( But the height of this plastic part is too low, the knob gonna touch the metal part.", "likes": 0, "replies": 0, "views": 0, "media": [{"file": "media/21-1130910580368449537-1.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}]}, {"id": "1130916709186056192", "url": "https://x.com/Ouarss/status/1130916709186056192", "date": "2019-05-21 19:22:09", "text": "Gamo2 feels better because the torque limiter is stuck and doesn't move a lot. Gona make a fix for the moving ones.", "likes": 0, "replies": 0, "views": 0, "media": [{"file": "media/22-1130916709186056192-1.mp4", "type": "video", "width": 720, "height": 1280, "duration": 35.597, "poster": "media/22-1130916709186056192-1.poster.jpg"}]}, {"id": "1132259452860731392", "url": "https://x.com/Ouarss/status/1132259452860731392", "date": "2019-05-25 12:17:44", "text": "We're cutting things ; easier than expected.", "likes": 2, "replies": 0, "views": 0, "media": [{"file": "media/23-1132259452860731392-1.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}]}, {"id": "1132699495 ss/status/1267107592335048704", "date": "2020-05-31 14:56:06", "text": "Painted black some special spots.\nAdded the lock thing with the back door  and hidden magnets.", "likes": 1, "replies": 0, "views": 0, "media": [{"file": "media/68-1267107592335048704-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1271844113642594305", "url": "https://x.com/Ouarss/status/1271844113642594305", "date": "2020-06-13 16:37:21", "text": "Final lights check.\nMain voltage wire is super hot, I have to change it and it's not gonna be easy :(\n\nI have to work on the woofer wire, too.\nAnd maybe the next step will be the assembly? I hope.", "likes": 20, "replies": 4, "views": 0, "media": [{"file": "media/69-1271844113642594305-1.mp4", "type": "video", "width": 1280, "height": 720, "duration": 44.979, "poster": "media/69-1271844113642594305-1.poster.jpg"}]}, {"id": "1272217439191908353", "url": "https://x.com/Ouarss/status/1272217439191908353", "date": "2020-06-14 17:20:48", "text": "IT'S DONE!\nAAAAAaAAAaAAAAAaAAAAaHH!\nStill some work and adjustments to make but that's cool.\nThe most important is the controller connector, I need a real one since mine sometimes miss some pins connexion (like here, the FXR).", "likes": 116, "replies": 10, "views": 0, "media": [{"file": "media/70-1272217439191908353-1.mp4", "type": "video", "width": 720, "height": 1280, "duration": 56.44, "poster": "media/70-1272217439191908353-1.poster.jpg"}]}, {"id": "1272219745580986371", "url": "https://x.com/Ouarss/status/1272219745580986371", "date": "2020-06-14 17:29:58", "text": "I'd like to thank you all, who helped me for lots of things ; even your likes really motivated me to go forward (i'm kinda lazy). \nI started this project by stalking yahoo auctions, in feb 2019.\nCosts me a lot, I think shipping + customs is approx. 50%.\nHere's some ASMR for you.", "likes": 14, "replies": 1, "views": 0, "media": [{"file": "media/71-1272219745580986371-1.mp4", "type": "video", "width": 720, "height": 1280, "duration": 36.499, "poster": "media/71-1272219745580986371-1.poster.jpg"}]}, {"id": "1272273759425216516", "url": "https://x.com/Ouarss/status/1272273759425216516", "date": "2020-06-14 21:04:36", "text": "Original parts :\nTopper\nSpeakers left/right\nController\nWoofer acrylic\nMarquee\n\nOther parts :\nWings (bootleg)\nAC knobs (gamo2, I switched some parts with the original ones)\nSound system : logitech Z625\n\nYou can check most of my progress in my previous tweets.", "likes": 8, "replies": 2, "views": 0, "media": []}, {"id": "1272634143755710466", "url": "https://x.com/Ouarss/status/1272634143755710466", "date": "2020-06-15 20:56:38", "text": "Here is a ~6 hours footage of the assembly in 2.2 minutes. (Potato webcam, potato quality)", "likes": 11, "replies": 0, "views": 0, "media": [{"file": "media/73-1272634143755710466-1.mp4", "type": "video", "width": 1280, "height": 720, "duration": 139.062, "poster": "media/73-1272634143755710466-1.poster.jpg"}]}, {"id": "1282404300434571265", "url": "https://x.com/Ouarss/status/1282404300434571265", "date": "2020-07-12 19:59:45", "text": "Finally made a decent sdvx <> usb plug'n'play with the RIGHT HEADER (XADR-34V/XADRP-34V was the keyword).\nDiscovered that the knobs wiring isn't the same for all cabs (?) Here, left and right wires are swapped.", "likes": 6, "replies": 1, "views": 0, "media": [{"file": "media/74-1282404300434571265-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/74-1282404300434571265-2.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/74-1282404300434571265-3.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/74-1282404300434571265-4.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}]}, {"id": "1284551662401658882", "url": "https://x.com/Ouarss/status/1284551662401658882", "date": "2020-07-18 18:12:36", "text": "Omg the pro micro is so tiny.\nMade a cleaner smaller converter with it.\nSeems like making wire is my new hobby xD", "likes": 0, "replies": 1, "views": 0, "media": []}, {"id": "1284551860557414400", "url": "https://x.com/Ouarss/status/1284551860557414400", "date": "2020-07-18 18:13:24", "text": "Forgot pics o/", "likes": 0, "replies": 0, "views": 0, "media": [{"file": "media/76-1284551860557414400-1.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}, {"file": "media/76-1284551860557414400-2.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1303029561811140609", "url": "https://x.com/Ouarss/status/1303029561811140609", "date": "2020-09-07 17:57:11", "text": "After (too) many experiments, I discovered custom PCBs, no more shitty soldering (~‾▿‾)~", "likes": 7, "replies": 2, "views": 0, "media": [{"file": "media/77-1303029561811140609-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/77-1303029561811140609-2.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1303106485887684611", "url": "https://x.com/Ouarss/status/1303106485887684611", "date": "2020-09-07 23:02:51", "text": "Wire done 🥳 \n5th version is the perfect one.\n\n2 slots available for extra buttons (back / random...)", "likes": 1, "replies": 0, "views": 0, "media": [{"file": "media/78-1303106485887684611-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1393342717560827907", "url": "https://x.com/Ouarss/status/1393342717560827907", "date": "2021-05-14 23:09:25", "text": "No hands 😫  Seems that knobs are too sensitive. I should have put some resistor or something between them & arduino.", "likes": 2, "replies": 2, "views": 0, "media": [{"file": "media/79-1393342717560827907-1.mp4", "type": "video", "width": 1280, "height": 720, "duration": 31.64, "poster": "media/79-1393342717560827907-1.poster.jpg"}]}, {"id": "1620869809859878917", "url": "https://x.com/Ouarss/status/1620869809859878917", "date": "2023-02-01 19:40:51", "text": "On peut enfin ouvrir les cartons et upgrade 🔥\nJ'avais pas vu que le topper était plié de base 🙃 avec ça de la casse sur le transport, pourtant très bien emballé 😐", "likes": 1, "replies": 1, "views": 215, "media": [{"file": "media/80-1620869809859878917-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/80-1620869809859878917-2.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/80-1620869809859878917-3.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}, {"file": "media/80-1620869809859878917-4.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1620880344345108483", "url": "https://x.com/Ouarss/status/1620880344345108483", "date": "2023-02-01 20:22:43", "text": "Yay !\nJ'ai triché pour la lumière, il faut que je bricole les nouveaux branchements et que je les passe en 5V.", "likes": 3, "replies": 1, "views": 176, "media": [{"file": "media/81-1620880344345108483-1.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}]}, {"id": "1667996644091068418", "url": "https://x.com/Ouarss/status/1667996644091068418", "date": "2023-06-11 20:46:04", "text": "Finally made my jack extension working.\nCut off the speakers when headphone is plugged in.", "likes": 2, "replies": 0, "views": 145, "media": [{"file": "media/82-1667996644091068418-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/82-1667996644091068418-2.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/82-1667996644091068418-3.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/82-1667996644091068418-4.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1717606358558630101", "url": "https://x.com/Ouarss/status/1717606358558630101", "date": "2023-10-26 18:17:22", "text": "Valkyreader 😉", "likes": 19, "replies": 2, "views": 401, "media": [{"file": "media/83-1717606358558630101-1.mp4", "type": "video", "width": 720, "height": 1280, "duration": 12.634, "poster": "media/83-1717606358558630101-1.poster.jpg"}]}, {"id": "1746515892505018786", "url": "https://x.com/Ouarss/status/1746515892505018786", "date": "2024-01-14 12:53:32", "text": "Finally added the front doors 😗", "likes": 6, "replies": 0, "views": 146, "media": [{"file": "media/84-1746515892505018786-1.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}, {"file": "media/84-1746515892505018786-2.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}, {"file": "media/84-1746515892505018786-3.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}, {"file": "media/84-1746515892505018786-4.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}]}, {"id": "1781672672591483186", "url": "https://x.com/Ouarss/status/1781672672591483186", "date": "2024-04-20 13:14:01", "text": "Improving LED wirings.", "likes": 11, "replies": 1, "views": 287, "media": [{"file": "media/85-1781672672591483186-1.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}]}, {"id": "1781673374457978884", "url": "https://x.com/Ouarss/status/1781673374457978884", "date": "2024-04-20 13:16:49", "text": "Black PCB would've been better but\nOnce it's ON it doesn't matter.\n\nI'm looking for a way to dim it like a neon but there's no tube for this (?)", "likes": 3, "replies": 1, "views": 103, "media": [{"file": "media/86-1781673374457978884-1.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}, {"file": "media/86-1781673374457978884-2.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}, {"file": "media/86-1781673374457978884-3.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}]}, {"id": "1781684263143821763", "url": "https://x.com/Ouarss/status/1781684263143821763", "date": "2024-04-20 14:00:05", "text": "Removed the old light system.\n\nIt was fun to setup an effect switcher, bluetooth remote control etc.\nIn reality it was only useful for lowering the brightness.\n\n(And it was super dangerous, when I see the wires I used. Hopefully they didn't melt.)", "likes": 1, "replies": 1, "views": 80, "media": [{"file": "media/87-1781684263143821763-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1782107523631255837", "url": "https://x.com/Ouarss/status/1782107523631255837", "date": "2024-04-21 18:01:58", "text": "VM wiring for controller / LEDs & Reader.\n\nRemoved the custom keypad/reader with original pieces.\n\nThe keypad will be useless, tho.", "likes": 0, "replies": 1, "views": 57, "media": [{"file": "media/88-1782107523631255837-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/88-1782107523631255837-2.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}, {"file": "media/88-1782107523631255837-3.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}]}, {"id": "1782107881229168787", "url": "https://x.com/Ouarss/status/1782107881229168787", "date": "2024-04-21 18:03:23", "text": "The VM topper has now two RGBs strips (plus the Whites).\n\nI could see the reflected LEDs on top, it wasn't glorious.\nI added some filter, it looks better.\n\n\"\"\"Filter\"\"\" = \"Non slip drawer liner\" 😅\n\nHere is some examples ⬇️", "likes": 4, "replies": 2, "views": 126, "media": [{"file": "media/89-1782107881229168787-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/89-1782107881229168787-2.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/89-1782107881229168787-3.mp4", "type": "video", "width": 1280, "height": 720, "duration": 18.041, "poster": "media/89-1782107881229168787-3.poster.jpg"}, {"file": "media/89-1782107881229168787-4.mp4", "type": "video", "width": 1280, "height": 720, "duration": 14.933, "poster": "media/89-1782107881229168787-4.poster.jpg"}]}, {"id": "1782173755223036371", "url": "https://x.com/Ouarss/status/1782173755223036371", "date": "2024-04-21 22:25:09", "text": "Everything's connected :)\n\nStill need some adjustments.\n\nAnd I need a touchscreen 🙃", "likes": 0, "replies": 1, "views": 171, "media": [{"file": "media/90-1782173755223036371-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/90-1782173755223036371-2.mp4", "type": "video", "width": 720, "height": 1280, "duration": 13.018, "poster": "media/90-1782173755223036371-2.poster.jpg"}]}, {"id": "1782175343417209247", "url": "https://x.com/Ouarss/status/1782175343417209247", "date": "2024-04-21 22:31:27", "text": "I REALLY thought it was too short.\n\nThis is absurd lmao.\n\n\"How long do you want your cable ?\"\n\"Yes\"\n\n(It's 2 meters from the IO to the connector 🫠)", "likes": 2, "replies": 0, "views": 160, "media": [{"file": "media/91-1782175343417209247-1.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}, {"file": "media/91-1782175343417209247-2.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}]}], "cover": "cover.jpg", "built": {"to": "2020-06-14", "from": "2019-05-04"}, "status": "done", "note": "No thread unfortunately, everything is spread in individual tweets :("}</script>
