<script id="thread-data" type="application/json">{"folder": "maimai", "title": "Maimai", "url": "https://x.com/Ouarss/status/1806786337842036974", "extra": [], "fetched_at": "2026-09-11T13:24:53", "author": {"name": "Ouarss", "handle": "Ouarss", "url": "https://x.com/Ouarss", "avatar": "media/avatar.jpeg"}, "posts": [{"id": "1806786337842036974", "url": "https://x.com/Ouarss/status/1806786337842036974", "date": "2024-06-28 20:26:46", "text": "Here we go again.\nWe got the glass.\nWe got the roll.\nWe cutted things for 8 hours straight on a coffee table, for only one set.\n\nNow we glue.", "likes": 6, "replies": 2, "views": 748, "media": [{"file": "media/01-1806786337842036974-1.jpg", "type": "photo", "width": 2048, "height": 1386, "duration": null}, {"file": "media/01-1806786337842036974-2.jpg", "type": "photo", "width": 819, "height": 2048, "duration": null}, {"file": "media/01-1806786337842036974-3.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1814722967525372379", "url": "https://x.com/Ouarss/status/1814722967525372379", "date": "2024-07-20 18:04:06", "text": "You have to oneshot the glue part.\n\nIf you pull-up something to readjust, it's dead. Will work, but it will look blurry (same thing as if you put your fingerprints on the glue)\n\n> Glue the bigger part first by keeping the other half protective film (the path)\n> Glue the path", "likes": 2, "replies": 1, "views": 171, "media": [{"file": "media/02-1814722967525372379-1.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}, {"file": "media/02-1814722967525372379-2.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}, {"file": "media/02-1814722967525372379-3.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1814723745119871165", "url": "https://x.com/Ouarss/status/1814723745119871165", "date": "2024-07-20 18:07:11", "text": "Simple wiring with copper scotch.\n\nI had spare sdvx connectors which are perfect (34 slots).\n\nI'm using the maipico project as IO (github).\n\nI'll make a better cable management later.", "likes": 3, "replies": 1, "views": 234, "media": [{"file": "media/03-1814723745119871165-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/03-1814723745119871165-2.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}, {"file": "media/03-1814723745119871165-3.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}]}, {"id": "1814725036395077843", "url": "https://x.com/Ouarss/status/1814725036395077843", "date": "2024-07-20 18:12:19", "text": "Here is the result, with and without the protective film.\n\nThere's only two parts with imperfections caused by some invisible dust.\nMaybe I'll replace them.\n\nOverall, it looks nice.", "likes": 6, "replies": 2, "views": 361, "media": [{"file": "media/04-1814725036395077843-1.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/04-1814725036395077843-2.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/04-1814725036395077843-3.jpg", "type": "photo", "width": 2048, "height": 1152, "duration": null}, {"file": "media/04-1814725036395077843-4.jpg", "type": "photo", "width": 1152, "height": 2048, "duration": null}]}, {"id": "1819072925921956031", "url": "https://x.com/Ouarss/status/1819072925921956031", "date": "2024-08-01 18:09:16", "text": "Got the MaiPod today, and its monitor.\nWe can go on ! 😗\n\nIt's aluminium, 2.5mm.\n\n(I think someone's jealous there)", "likes": 5, "replies": 1, "views": 254, "media": [{"file": "media/05-1819072925921956031-1.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}, {"file": "media/05-1819072925921956031-2.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}, {"file": "media/05-1819072925921956031-3.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}]}, {"id": "1819767002380058899", "url": "https://x.com/Ouarss/status/1819767002380058899", "date": "2024-08-03 16:07:17", "text": "Inserts are perfect.\nBUT the small ones are so hard to fit in.\n\nI fucked up half of them because my crimp tool is a cheap thing from aliexpress, the thread \"slide in\" instead if locking it :(\n\nAlso 2.5mm thickness is maybe a little bit too much for M3 inserts.", "likes": 4, "replies": 1, "views": 235, "media": [{"file": "media/06-1819767002380058899-1.jpg", "type": "photo", "width": 2048, "height": 1542, "duration": null}, {"file": "media/06-1819767002380058899-2.jpg", "type": "photo", "width": 2048, "height": 1542, "duration": null}, {"file": "media/06-1819767002380058899-3.jpg", "type": "photo", "width": 2048, "height": 1542, "duration": null}, {"file": "media/06-1819767002380058899-4.jpg", "type": "photo", "width": 2048, "height": 1542, "duration": null}]}, {"id": "1823425303026294863", "url": "https://x.com/Ouarss/status/1823425303026294863", "date": "2024-08-13 18:24:04", "text": "Started the main body.\nWaiting for the woofer & a coin door.\n\n5.1 sound system ; put two speakers at the bottom, and two will be on top ; Wacca style.\n\nSome space at the middle welcome the reader.\n\nI'll finish the bottom part with an acrylic cover.", "likes": 7, "replies": 3, "views": 226, "media": [{"file": "media/07-1823425303026294863-1.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}, {"file": "media/07-1823425303026294863-2.jpg", "type": "photo", "width": 2048, "height": 1542, "duration": null}, {"file": "media/07-1823425303026294863-3.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}]}, {"id": "1824112581105058058", "url": "https://x.com/Ouarss/status/1824112581105058058", "date": "2024-08-15 15:55:04", "text": "Glass protection with 2mm foam.\n\nHere is how the glass is attached, squeezed by metal pieces\n\nBUT, the metal structure can bend a little bit if we push too hard on the top/bottom edges of the circle\n\nI have to put some wood support to avoid this bending & potential glass damage.", "likes": 3, "replies": 1, "views": 195, "media": [{"file": "media/08-1824112581105058058-1.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}, {"file": "media/08-1824112581105058058-2.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}, {"file": "media/08-1824112581105058058-3.jpg", "type": "photo", "width": 2048, "height": 1542, "duration": null}, {"file": "media/08-1824112581105058058-4.jpg", "type": "photo", "width": 2048, "height": 1478, "duration": null}]}, {"id": "1824597253304074411", "url": "https://x.com/Ouarss/status/1824597253304074411", "date": "2024-08-17 00:00:59", "text": "10mm wood reinforcments.\nThe metal don't bend at all, it's now super strong.\nNo more worried to damage the glass which is attached to the metal\n\nPut foam everywhere so I can squeeze the screen closest to the glass\n\nMonitor has been adjusted at the speed of light 🥳\n\nNow we paint", "likes": 6, "replies": 1, "views": 322, "media": [{"file": "media/09-1824597253304074411-1.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}, {"file": "media/09-1824597253304074411-2.mp4", "type": "video", "width": 720, "height": 1280, "duration": 7.443, "poster": "media/09-1824597253304074411-2.poster.jpg"}, {"file": "media/09-1824597253304074411-3.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}, {"file": "media/09-1824597253304074411-4.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}]}, {"id": "1825652187994964476", "url": "https://x.com/Ouarss/status/1825652187994964476", "date": "2024-08-19 21:52:55", "text": "Aaaaand it's black !\n\nScotched everything.\nI was worried about this, but it's super responsive !\n\nNow, small break while waiting for the last parts.", "likes": 3, "replies": 1, "views": 292, "media": [{"file": "media/10-1825652187994964476-1.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}, {"file": "media/10-1825652187994964476-2.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}, {"file": "media/10-1825652187994964476-3.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}, {"file": "media/10-1825652187994964476-4.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}]}, {"id": "1825960765314183420", "url": "https://x.com/Ouarss/status/1825960765314183420", "date": "2024-08-20 18:19:05", "text": "Found a logitech woofer second hand.\nAlready inside.\n\nØ 27cm 🤏", "likes": 5, "replies": 1, "views": 415, "media": [{"file": "media/11-1825960765314183420-1.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}, {"file": "media/11-1825960765314183420-2.jpg", "type": "photo", "width": 2048, "height": 1542, "duration": null}, {"file": "media/11-1825960765314183420-3.jpg", "type": "photo", "width": 2048, "height": 1542, "duration": null}, {"file": "media/11-1825960765314183420-4.jpg", "type": "photo", "width": 2048, "height": 1542, "duration": null}]}, {"id": "1841186161949110728", "url": "https://x.com/Ouarss/status/1841186161949110728", "date": "2024-10-01 18:39:23", "text": "Hard to find any motivation lately but I managed to setup the lights in the rabbit's buttons.\n\nIt's not natively compatible, you'll have to trim some parts to fit the LEDs.\n(Used a cutter, snap-it znd smooth finish with a dremel).", "likes": 6, "replies": 1, "views": 377, "media": [{"file": "media/12-1841186161949110728-1.jpg", "type": "photo", "width": 2048, "height": 1542, "duration": null}, {"file": "media/12-1841186161949110728-2.jpg", "type": "photo", "width": 2048, "height": 1542, "duration": null}, {"file": "media/12-1841186161949110728-3.mp4", "type": "video", "width": 720, "height": 1280, "duration": 49.405, "poster": "media/12-1841186161949110728-3.poster.jpg"}, {"file": "media/12-1841186161949110728-4.mp4", "type": "video", "width": 720, "height": 1280, "duration": 19.105, "poster": "media/12-1841186161949110728-4.poster.jpg"}]}, {"id": "1923849713347916167", "url": "https://x.com/Ouarss/status/1923849713347916167", "date": "2025-05-17 21:14:49", "text": "Reworked the whole touch wiring.\n\nMy first connector had loose red wires (copper).\nVibrations would sometimes trigger misfires.\n\nMy wires are thick enough to sqeeze them like I do without issue. (26AWG, 1.3 outer diameter).\n\nI fixed the wires with doubleside tape.\nSuper strong.", "likes": 7, "replies": 0, "views": 356, "media": [{"file": "media/13-1923849713347916167-1.jpg", "type": "photo", "width": 1542, "height": 2048, "duration": null}, {"file": "media/13-1923849713347916167-2.jpg", "type": "photo", "width": 2048, "height": 1542, "duration": null}, {"file": "media/13-1923849713347916167-3.jpg", "type": "photo", "width": 2048, "height": 1542, "duration": null}, {"file": "media/13-1923849713347916167-4.jpg", "type": "photo", "width": 2048, "height": 1542, "duration": null}]}], "status": "wip"}</script>
